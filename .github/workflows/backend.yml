name: Backend Check

on:
  push:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go-image-gateway/**'
      - 'deploy/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'docker-compose*'
      - 'scripts/**'
      - '.github/workflows/backend.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go-image-gateway/**'
      - 'deploy/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'docker-compose*'
      - 'scripts/**'
      - '.github/workflows/backend.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/docker-publish.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: |
            go.sum
            go-image-gateway/go.sum
      - name: Tests
        run: bash scripts/check-backend.sh test
      - name: CI build
        run: bash scripts/check-backend.sh build
      - name: Static analysis
        run: bash scripts/check-backend.sh static
